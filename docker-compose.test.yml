# Started by tests/testenv with a fresh run ID and credentials for every run.
# No application .env, development ports, container names, or external volumes.
x-test-labels: &test-labels
  io.ichat.test.run: ${ICHAT_TEST_RUN_ID:?use tests/testenv to start the test environment}

services:
  mysql:
    image: mysql:8.0@sha256:f37951fc3753a6a22d6c7bf6978c5e5fefcf6f31814d98c582524f98eae52b21
    labels: *test-labels
    environment:
      MYSQL_ROOT_PASSWORD: ${ICHAT_TEST_PASSWORD:?test password is required}
      MYSQL_DATABASE: ichat_test_${ICHAT_TEST_RUN_ID}
      MYSQL_USER: ichat_test
      MYSQL_PASSWORD: ${ICHAT_TEST_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1::3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 20s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    labels: *test-labels
    environment:
      REDIS_PASSWORD: ${ICHAT_TEST_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1::6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -qx PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mysql_data:
    labels: *test-labels
  redis_data:
    labels: *test-labels

networks:
  default:
    labels: *test-labels
