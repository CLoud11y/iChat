APP:
  name: iChat
  version: 0.1
LEGACY_WORKER:
  # Enable on only one application instance while the legacy queue is in use.
  enabled: false
MYSQL:
  host: 127.0.0.1
  user: root
  password: 
  dbname: iChat
  port: 3306
JWT:
  tokenHourLifeSpan: 1
  key: change-me
REDIS:
  addr: 127.0.0.1:6379
  password: 
  db: 0
  poolSize: 30
  minIdleConn: 5
LOG:
  path: /logfiles/
  level: info
  accessEnabled: true
RABBITMQ:
  # Configuration preparation only; MQ is not yet assembled in the main app.
  # Leave all four connection/credential fields empty for the legacy service.
  # Local AMQP example (vhost /ichat): amqp://ichat_app:CHANGE_ME@127.0.0.1:5672/%2Fichat
  url: ""
  vhost: /ichat
  managementURL: ""
  managementUsername: ""
  managementPassword: ""
  publisherSlots: 8
  publishTimeout: 5s
  connectTimeout: 5s
  writeTimeout: 3s
  closeTimeout: 3s
  heartbeat: 2s
  retryMin: 1s
  retryMax: 30s
